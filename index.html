<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CN AI - Projects Hub</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Tajawal & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --border-hover: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-purple: #6366f1;
      --accent-purple-light: #eeef2e1;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 25px -5px rgba(99, 102, 241, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 24px 24px;
    }

    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.85rem 1.5rem;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
      font-family: 'Fira Code', monospace;
      letter-spacing: -0.5px;
    }

    .brand-badge {
      background: rgba(99, 102, 241, 0.1);
      color: var(--accent-purple);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      font-family: 'Fira Code', monospace;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      color: #ffffff;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'Fira Code', monospace;
      font-weight: 500;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .github-link:hover {
      background: #1e293b;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      flex: 1;
      width: 100%;
    }

    .hero-section {
      text-align: center;
      margin-bottom: 3rem;
    }

    .hero-title {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: var(--text-main);
      line-height: 1.3;
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      max-width: 600px;
      margin: 0 auto;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      background: var(--primary-gradient);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-lg);
    }

    .project-card:hover::before {
      opacity: 1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .project-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #f1f5f9;
      color: var(--accent-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      border: 1px solid var(--border-color);
    }

    .project-title {
      font-size: 1.25rem;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: var(--text-main);
      margin-bottom: 1.5rem;
    }

    .card-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.85rem;
      border-top: 1px solid #f1f5f9;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-purple);
      font-family: 'Fira Code', monospace;
    }

    .card-action i {
      transition: transform 0.2s ease;
    }

    .project-card:hover .card-action i {
      transform: translateX(-4px);
    }

    footer {
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 1.25rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Fira Code', monospace;
    }

    .footer-logo {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }

    @media (max-width: 480px) {
      header {
        padding: 0.75rem 1rem;
      }
      
      .brand-badge {
        display: none;
      }

      .github-link span {
        display: none;
      }
      
      .github-link {
        padding: 0.5rem;
        border-radius: 50%;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
